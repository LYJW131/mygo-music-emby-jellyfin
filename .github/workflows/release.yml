name: Release

# Pushing a tag v<version> releases that commit: it has to be on main and the
# version has to be plugin.json's. The release carries the zip MyGo Music
# installs, and the app offers it as an update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag is plugin.json's version, on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(jq -r .version plugin.json)"
          if [[ "$TAG" != "$version" ]]; then
            echo "The tag is $TAG but plugin.json says $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG isn't on main" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code
      - name: Check the zip
        working-directory: dist/release
        run: sha256sum --check ./*.sha256
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/release/*.zip dist/release/*.sha256 --verify-tag --generate-notes --title "$TAG"
